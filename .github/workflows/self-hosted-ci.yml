name: Self-Hosted CI (build & test)

# Proof-of-concept pipeline for the self-hosted runner on the Debian server.
# Deliberately separate from ci.yml: it is not wired into branch protection,
# so a runner outage or misconfiguration can never block merges to main.
# Scope for now: backend-api, backend-worker, frontend build + existing tests.
# No deploy step — deploys stay on Render/Vercel auto-deploy as today.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, mesha]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Backend API - compile and test
        working-directory: ./platform/backend-api
        run: mvn clean test
        env:
          SENTRY_SKIP_SOURCE_BUNDLE: "true"

      - name: Backend Worker - compile and test
        working-directory: ./platform/backend-worker
        run: mvn clean test
        env:
          SENTRY_SKIP_SOURCE_BUNDLE: "true"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Frontend - install dependencies
        working-directory: ./platform/frontend
        run: npm ci

      - name: Frontend - lint
        working-directory: ./platform/frontend
        run: npm run lint

      - name: Frontend - type check
        working-directory: ./platform/frontend
        run: npm run type-check

      - name: Frontend - build
        working-directory: ./platform/frontend
        run: npm run build
